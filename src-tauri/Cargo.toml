[package]
name = "unoeditor"
version = "0.1.0"
description = "UNOEditor - 多主题 Markdown 排版编辑器"
authors = ["UNOEditor"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
