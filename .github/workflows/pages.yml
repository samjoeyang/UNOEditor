name: Deploy Pages

# 将官网 docs/ 部署到 GitHub Pages（docs/ 内已包含完整应用副本 docs/app/）。
# 自定义域名 unoeditor.zhenzhidaole.com 已在仓库 Settings → Pages 中配置；
# docs/CNAME 必须随 artifact 一起上传，否则 actions/deploy-pages 部署的站点
# 不会写入 CNAME，自定义域名会返回 404。
# docs/.nojekyll 保证 .md 镜像按原文提供，不被 Jekyll 渲染成 HTML。
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'themes/**'
      - 'copy-dist.sh'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# 允许 Actions 部署到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，避免互相覆盖
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 构建与上传拆成独立 job：新 runner (Ubuntu 26.04 / Node 24) 上若把 upload
  # 与 deploy 放在同一 job，deploy 步骤有时查不到刚上传的 github-pages
  # artifact（"No artifacts named github-pages were found"）。分成两 job 后，
  # deploy 在 build 完全结束后才启动，artifact 元数据一定可见。
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 同步最新应用到 docs/app/ 与官网主题演示资源
      - name: Build static site and sync into docs/app
        run: sh copy-dist.sh && sh scripts/sync-site.sh && touch docs/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
